<div class="col-md-12">
    <div class="card">
        <dx-data-grid [dataSource]="unionsSvc.Union()" (onRowClick)="handleRowClicked($event)" [showBorders]="true">
            <dxo-data-grid-filter-row [visible]="true"></dxo-data-grid-filter-row>
            <dxo-data-grid-editing mode="popup" [allowAdding]="false" [allowUpdating]="true" [allowDeleting]="true"></dxo-data-grid-editing>

            <dxi-data-grid-column dataField="id" dataType="number" caption="Id"></dxi-data-grid-column>
            <dxi-data-grid-column dataField="idUser" caption="Cognome Nome">
                <dxo-lookup
                    [dataSource]="usersSvc.User()"
                    valueExpr="id"
                    [displayExpr]="getUserFullName">
                </dxo-lookup>
            </dxi-data-grid-column>
            <dxi-data-grid-column dataField="idProject" caption="Progetto">
                <dxo-lookup
                    [dataSource]="projectsSvc.Project()"
                    valueExpr="id"
                    displayExpr="name">
                </dxo-lookup>
            </dxi-data-grid-column>
            <dxi-data-grid-column dataField="idProject" caption="Durata Progetto">
                <dxo-lookup
                    [dataSource]="projectsSvc.Project()"
                    valueExpr="id"
                    [displayExpr]="getDuration">
                </dxo-lookup>
            </dxi-data-grid-column>
            <dxi-data-grid-column dataField="hours" dataType="number" caption="Ore"></dxi-data-grid-column>

            
            <dxi-data-grid-column type="buttons"  caption="Elimina">
                <dxi-data-grid-button name="delete" icon="trash" text="Elimina"></dxi-data-grid-button>
            </dxi-data-grid-column>
        </dx-data-grid>
    </div>
</div><br>
<button type="button" class="btn btn-success" (click)="handleNewUnion()">Nuova associazione</button><br><br>
<button type="button" class="btn btn-success" (click)="unionsSvc.deleteUnionUser(1)">Elimina utente</button><br><br>
<button type="button" class="btn btn-success" (click)="unionsSvc.deleteUnionProject(1)">Elimina progetto</button><br><br>
