<div class="container">
    <h3><b>{{'common.title.association' | translate}}</b></h3><br>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <dx-data-grid [dataSource]="unionsSvc.Union()" (onRowClick)="handleRowClicked($event)" [showBorders]="true">
                        <dxo-data-grid-filter-row [visible]="true"></dxo-data-grid-filter-row>
                        <dxo-data-grid-editing mode="popup"></dxo-data-grid-editing>

                        <dxi-data-grid-column dataField="id" dataType="number" caption="{{'common.id' | translate}}"  width="80"></dxi-data-grid-column>
                        <dxi-data-grid-column dataField="idUser" caption="{{'association.table.surname-name' | translate}}">
                            <dxo-lookup
                                [dataSource]="usersSvc.User()"
                                valueExpr="id"
                                [displayExpr]="getUserFullName">
                            </dxo-lookup>
                        </dxi-data-grid-column>
                        <dxi-data-grid-column dataField="idProject" caption="{{'association.table.project' | translate}}">
                            <dxo-lookup
                                [dataSource]="projectsSvc.Project()"
                                valueExpr="id"
                                displayExpr="name">
                            </dxo-lookup>
                        </dxi-data-grid-column>
                        <dxi-data-grid-column dataField="idProject" caption="{{'association.table.project-duration' | translate}}">
                            <dxo-lookup
                                [dataSource]="projectsSvc.Project()"
                                valueExpr="id"
                                [displayExpr]="getDuration">
                            </dxo-lookup>
                        </dxi-data-grid-column>
                        <dxi-data-grid-column dataField="hours" dataType="number" caption="{{'association.table.hour' | translate}}"  width="100"></dxi-data-grid-column>
                        <dxi-column type="buttons" caption="{{'common.button.delete' | translate}}">
                            <dxi-button 
                                hint="Elimina"
                                icon="trash"
                                [onClick]="onDeleteClick">
                            </dxi-button>
                        </dxi-column>
                    </dx-data-grid>
                </div>
            </div>
        </div><br>
    </div>
    <br>
    <button type="button" class="btn btn-dark" (click)="handleNewUnion()">{{'common.button.add' | translate}} {{'common.title.association' | translate | lowercase}}</button><br><br>
    <!--
    <button type="button" class="btn btn-success" (click)="unionsSvc.deleteUnionUser(1)">Elimina utente</button><br><br>
    <button type="button" class="btn btn-success" (click)="unionsSvc.deleteUnionProject(1)">Elimina progetto</button><br><br>
    -->
</div>
