<div class="container">
    <h3><b>{{'common.title.project' | translate}}</b></h3><br>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <dx-data-grid [dataSource]="projectSvc.Project()" (onRowClick)="handleRowClicked($event)" [showBorders]="true">
                        <dxo-data-grid-filter-row [visible]="true"></dxo-data-grid-filter-row>
                        <dxi-data-grid-column dataField="id" dataType="number" caption="{{'common.id' | translate}}"  width="80"></dxi-data-grid-column>
                        <dxi-data-grid-column dataField="name" dataType="string" caption="{{'project.table.name' | translate}}"></dxi-data-grid-column>
                        <dxi-data-grid-column dataField="type" dataType="string"caption="{{'project.table.type' | translate}}" width="160">
                            <dxo-lookup
                                [dataSource]="ProjectTypes"
                                valueExpr="id"
                                displayExpr="text">
                            </dxo-lookup>
                            </dxi-data-grid-column>
                        <dxi-data-grid-column dataField="description" dataType="string" caption="{{'project.table.description' | translate}}"></dxi-data-grid-column>
                        <dxi-data-grid-column dataField="dateStart" dataType="date" format="dd/MM/yyyy" caption="{{'project.table.date-start' | translate}}" width="120"></dxi-data-grid-column>
                        <dxi-data-grid-column dataField="dateFinish" dataType="date" format="dd/MM/yyyy" caption="{{'project.table.date-finish' | translate}}" width="120"></dxi-data-grid-column>
    
                        <dxi-column type="buttons" caption="{{'common.button.delete' | translate}}">
                            <dxi-button
                                hint="Delete"
                                icon="trash"
                                [onClick]="handleDeleteClick">
                            </dxi-button>
                        </dxi-column>
                    </dx-data-grid>
                </div>
            </div>
        </div>
    </div>
    <br>
    <button type="button" class="btn btn-dark" (click)="handleNewProject()">{{'common.button.add' | translate}} {{'common.title.project' | translate | lowercase}}</button>
<br>
<br>

<div class="row">

  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <dx-pie-chart title="{{'project.table.type' | translate}}" [dataSource]="ProjectTypeData()">
          <dxi-pie-chart-series argumentField="type" valueField="value">
            <dxo-pie-chart-label [visible]="true" position="columns">
              <dxo-pie-chart-font [size]="16"></dxo-pie-chart-font>
              <dxo-pie-chart-connector [visible]="true" [width]="0.5"></dxo-pie-chart-connector>
            </dxo-pie-chart-label>
          </dxi-pie-chart-series>
        </dx-pie-chart>
      </div>
    </div>
  </div>
</div>
