@let isLoading = UserSvc.loading();
<h3><b>{{'resource.title' | translate}}</b></h3>
<div class="container">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          @if(isLoading){
            <lib-loading-indicator />
          }@else{

          <dx-data-grid [dataSource]="UserSvc.User()" (onRowClick)="handleRowClicked($event)" [showBorders]="true">
            <dxo-data-grid-filter-row [visible]="true"></dxo-data-grid-filter-row>
            <dxo-data-grid-editing mode="popup" [allowAdding]="false" [allowUpdating]="true"
              [allowDeleting]="true"></dxo-data-grid-editing>


            

            <dxi-data-grid-column dataField="id" dataType="number" caption="Id" width="80"></dxi-data-grid-column>
            <dxi-data-grid-column dataField="surname" dataType="string" caption="{{'resource.surname' | translate}}"></dxi-data-grid-column>
            <dxi-data-grid-column dataField="name" dataType="string" caption="{{'resource.name' | translate}}"></dxi-data-grid-column>
            <dxi-data-grid-column dataField="role" dataType="string"caption="{{'resource.role' | translate}}"></dxi-data-grid-column>
            <dxi-data-grid-column dataField="dateBirth" dataType="date" format="dd/MM/yyyy" caption="{{'resource.birthday-date' | translate}}"></dxi-data-grid-column>
            
            <dxi-column type="buttons" caption="{{'common.button.delete' | translate}}">
              <dxi-button 
                hint="Elimina"
                icon="trash"
                [onClick]="onDeleteClick">
              </dxi-button>
            </dxi-column>
          </dx-data-grid>
          }
        </div>
      </div>
    </div>
  </div>
  <br>
  <button type="button" class="btn btn-outline-success" (click)="handleNewUser()">
    {{'common.button.add' | translate}}
  </button>
</div>
