<div class="d-flex flex-column min-vh-100">
  <!--  NAVBAR -->
    
  <nav class="navbar navbar-dark bg-dark px-3">
    <div class="container-fluid">
      <div class="row w-100" style="align-items: center;">
          <div class="col-3" style="padding-left: 0;">
            <button type="button" class="btn btn-outline-light" (click)="openMenu()">☰</button>
          </div>
          <div class="col-6" style="text-align: center;">
            <h1 style="color:white;">
              {{ "nav.page-name" | translate }}
            </h1>
          </div>
          <div class="col-3 text-end">
            <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
              <input
                type="radio"
                class="btn-check"
                name="btnradio"
                id="btnradio1"
                autocomplete="off"
                checked
              />
              <label class="btn btn-outline-light" for="btnradio1" (click)="ChangeItaliano()">Italiano</label>
              <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off" />
              <label class="btn btn-outline-light" for="btnradio2" (click)="ChangeEnglish()">English</label>
            </div>
          </div>
      </div>
    </div>
  </nav>

  <!--  CONTENUTO CENTRALE -->
  <div class="d-flex flex-grow-1">

  @if(isShown()){
    <!-- SIDEBAR -->
    <aside class="bg-dark text-white p-3" style="width: 250px">
      <h5 class="text-uppercase">{{ "nav.menu" | translate }}</h5>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/home/dashboard">
            {{ "nav.dashboard" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/home/resources">
            {{ "nav.resource" | translate }}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/home/projects">
            {{ "nav.project" | translate }}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/home/presences">
            {{ "nav.association" | translate }}
          </a>
        </li>
      </ul>
    </aside>
  }

    <!--  AREA CONTENUTO -->
    <main class="flex-grow-1 p-4 bg-light">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!--  FOOTER -->
  <app-footer textKey="nav.footer" />
</div>
