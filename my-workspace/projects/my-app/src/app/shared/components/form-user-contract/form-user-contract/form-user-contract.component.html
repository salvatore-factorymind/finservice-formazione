<div class="btn-group" role="group" aria-label="Basic outlined example">
  <button 
    [disabled]="disabled()"
    type="button" 
    class="btn btn-outline-primary" 
    [class.active]="value() === ContractType.Permanent" 
    (click)="handleValueChanged(ContractType.Permanent)">
    {{"resource.Permanent" | translate}}
  </button>
  <button
    [disabled]="disabled()"
    type="button" 
    class="btn btn-outline-primary" 
    [class.active]="value() === ContractType.FixedTerm" 
    (click)="handleValueChanged(ContractType.FixedTerm)">
    {{"resource.FixedTerm" | translate}}
  </button>
    <button
    [disabled]="disabled()"
    type="button" 
    class="btn btn-outline-primary" 
    [class.active]="value() === ContractType.Intern" 
    (click)="handleValueChanged(ContractType.Intern)">
    {{"resource.Intern" | translate}}
  </button>
</div>
